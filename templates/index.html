<!DOCTYPE html>
<html>
<head>
    <title>Mental Health Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            font-weight: bold;
            color: #34495e;
        }
        input, select {

            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;

            border-radius: 8px;
            border: 1px solid #ccc;

            font-size: 15px;
            box-sizing: border-box;
        }
        button {

            width: 100%;
            padding: 14px;

            background: #3498db;
            color:white;

            border:none;
            border-radius:8px;

            font-size:16px;
            cursor:pointer;
        }
        button:hover {

            background:#2980b9;

        }
        #result {

            margin-top:25px;
            text-align:center;
            font-size:20px;
            font-weight:bold;

        }
        .hint {

            font-size:13px;
            color:gray;
            margin-top:-15px;
            margin-bottom:15px;

        }
    </style>
</head>
<body>
<div class="card">
<h1>🧠 Mental Health Check</h1>

<form id="predictForm">
<label>
📱 Daily Leisure Screen Time (hours)
</label>

<input 
type="number"
step="any"
name="screen_hours"
placeholder="Example: 4.5"
required>
<label>
😴 Average Sleep Duration (hours)
</label>

<input 
type="number"
step="any"
name="sleep_hours"
placeholder="Example: 7.5"
required>

<label>
👤 Gender
</label>

<select name="gender" required>
<option value="0">
Boy (0)
</option>

<option value="1">
Girl (1)
</option>
</select>
<p class="hint">
Boy = 0 , Girl = 1
</p>
<button type="submit">
Check Result
</button>
</form>
<div id="result"></div>

</div>
<script>

document.getElementById("predictForm")
.addEventListener("submit", function(e){
    e.preventDefault();
    let data = {


        screen_hours:
        document.getElementsByName("screen_hours")[0].value,


        sleep_hours:
        document.getElementsByName("sleep_hours")[0].value,


        gender:
        document.getElementsByName("gender")[0].value


    };
    document.getElementById("result").innerHTML =
    "Analyzing... ⏳";
    fetch("/predict", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {


        if(result.prediction=="Depressed"){
            document.getElementById("result").innerHTML =
            "⚠️ Result: Depressed Pattern Detected";
        }
        else{
            document.getElementById("result").innerHTML =
            "✅ Result: Healthy Pattern Detected";
        }
    })
    .catch(error=>{
        document.getElementById("result").innerHTML =
        "Something went wrong";


    });
});
</script>
</body>
</html>
